name: Pages

# Publication is an explicit maintainer action, never a push or PR side effect.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package site
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out selected default-branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, unit tests, and production build
        run: npm run check
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Browser tests against production preview
        run: npm run test:e2e
      - name: Preserve synthetic browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Read Pages configuration (enable Pages in settings first)
        uses: actions/configure-pages@v5
      - name: Upload tested production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy reviewed site
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4